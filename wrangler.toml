name = "hono-auth"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:8787"
JWT_ISSUER = "https://auth.local"
JWT_AUDIENCE = "hono-auth-client"
COOKIE_SECRET = "super-secret-cookie-encryption-key-min-32-chars-long"
# COOKIE_DOMAIN = ".yourdomain.com" # Uncomment and adjust for multi-subdomain auth

[[d1_databases]]
binding = "DB"
database_name = "hono-auth-db"
database_id = "local-d1-db"
migrations_dir = "drizzle/migrations"
