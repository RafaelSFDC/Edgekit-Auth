name = "edgekit-auth"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:8787"
BETTER_AUTH_URL = "http://localhost:8787"
BETTER_AUTH_SECRET = "super-secret-better-auth-key-min-32-chars-long-12345"
COOKIE_SECRET = "super-secret-cookie-encryption-key-min-32-chars-long"

[[d1_databases]]
binding = "DB"
database_name = "hono-auth-db"
database_id = "local-d1-db"
migrations_dir = "drizzle/migrations"
